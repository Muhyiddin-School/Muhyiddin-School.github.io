<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Clock + 3 Subject</title>

<style>

/* =========================
   RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
}


/* =========================
   BODY
========================= */

body{

    min-height:100vh;

    background:#000;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    display:flex;

    justify-content:center;
    align-items:center;

    overflow:hidden;
}


/* =========================
   DASHBOARD
========================= */

.dashboard{

    width:100vw;
    height:100vh;

    display:flex;

    align-items:center;
    justify-content:center;

    gap:20px;

    padding:20px;
}


/* =========================
   CLOCK AREA
========================= */

.clock-wrap{

    width:50%;
    height:100%;

    display:flex;

    justify-content:center;
    align-items:center;

    min-width:0;
}


/* =========================
   CLOCK
========================= */

.clock{

    width:min(
        100%,
        calc(100vh - 40px)
    );

    aspect-ratio:1 / 1;

    border-radius:50%;

    position:relative;

    background:
        radial-gradient(
            circle,
            #ffffff 0%,
            #ececec 70%,
            #d5d5d5 100%
        );

    border:10px solid #222;

    box-shadow:
        0 0 40px rgba(0,0,0,.5),
        inset 0 0 25px rgba(0,0,0,.15);

    overflow:hidden;

    flex-shrink:0;
}


/* =========================
   NUMBERS
========================= */

.number{

    position:absolute;

    width:100%;
    height:100%;

    font-size:
        clamp(
            1.5rem,
            4vw,
            4rem
        );

    font-weight:bold;

    color:#222;

    text-align:center;
}

.number span{

    display:inline-block;

    transform:
        translateY(30px);
}


/* =========================
   TICKS
========================= */

.tick{

    position:absolute;

    left:50%;
    top:50%;

    width:4px;
    height:48%;

    transform-origin:
        50% 100%;
}

.tick::before{

    content:"";

    display:block;

    width:2px;
    height:10px;

    margin:auto;

    background:#555;
}

.tick.major::before{

    width:4px;
    height:18px;

    background:#111;
}


/* =========================
   CLOCK HANDS
========================= */

.hand{

    position:absolute;

    left:50%;
    bottom:50%;

    transform-origin:
        bottom center;

    border-radius:999px;

    z-index:10;
}

.hour{

    width:26px;
    height:30%;

    background:#111;
}

.minute{

    width:18px;
    height:40%;

    background:#222;
}

.second{

    width:6px;
    height:43%;

    background:#e11d48;
}


/* =========================
   CENTER
========================= */

.center{

    position:absolute;

    left:50%;
    top:50%;

    width:18px;
    height:18px;

    transform:
        translate(-50%,-50%);

    background:#111;

    border-radius:50%;

    z-index:20;
}


/* =========================
   DIGITAL TIME
========================= */

.digital{

    position:absolute;

    left:50%;
    bottom:38%;

    transform:
        translateX(-50%);

    font-size:
        clamp(
            1.2rem,
            3vw,
            2.5rem
        );

    font-weight:bold;

    color:#fff;

    background:#333;

    border-radius:20px;

    padding:
        2px 8px;

    font-family:
        Consolas,
        monospace;

    white-space:nowrap;

    z-index:50;

    transition:
        opacity .25s ease,
        visibility .25s ease;
}


/* =========================
   DATE
========================= */

.date{

    position:absolute;

    left:50%;
    bottom:28%;

    transform:
        translateX(-50%);

    font-size:
        clamp(
            1rem,
            2vw,
            2rem
        );

    font-weight:bold;

    color:#fff;

    background:#333;

    border-radius:20px;

    padding:
        2px 8px;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    white-space:nowrap;

    z-index:50;

    transition:
        opacity .25s ease,
        visibility .25s ease;
}


/* =========================
   HIDE DIGITAL + DATE
========================= */

.clock.hide-info .digital,
.clock.hide-info .date{

    opacity:0;

    visibility:hidden;

    pointer-events:none;
}


/* =========================
   TOGGLE BUTTON
========================= */

.toggle-info{

    position:fixed;

    top:10px;
    right:10px;

    z-index:99999;

    width:34px;
    height:34px;

    border:none;

    border-radius:50%;

    background:#333;

    color:#fff;

    font-size:16px;

    cursor:pointer;

    display:flex;

    justify-content:center;
    align-items:center;

    opacity:.65;

    transition:
        background .2s ease,
        opacity .2s ease,
        transform .2s ease;
}

.toggle-info:hover{

    background:#555;

    opacity:1;

    transform:scale(1.08);
}

.toggle-info:active{

    transform:scale(.95);
}


/* =========================
   TABLE AREA
========================= */

.table-wrap{

    width:50%;
    height:100%;

    display:flex;

    justify-content:center;
    align-items:center;

    min-width:0;

    overflow:hidden;
}


/* =========================
   TWO TABLES CONTAINER
========================= */

.tables{

    width:100%;

    height:100%;

    display:flex;

    flex-direction:column;

    justify-content:center;

    gap:20px;

    overflow:hidden;
}


/* =========================
   INDIVIDUAL TABLE
========================= */

.info{

    width:100%;

    background:#fff;

    border-radius:15px;

    border:3px solid #000;

    padding:20px;

    font-size:35px;

    overflow:hidden;

    flex:1;

    display:flex;

    flex-direction:column;

    justify-content:center;
}


/* =========================
   SUBJECT HEADING
========================= */

.subject-heading{

    width:100%;

    text-align:center;

    font-size:
        clamp(
            1.3rem,
            2.5vw,
            2.5rem
        );

    font-weight:bold;

    color:#000;

    padding:
        8px 10px
        15px 10px;

    margin-bottom:5px;

    outline:none;

    border-bottom:
        2px solid #000;
}


/* =========================
   TABLE ROW
========================= */

.row{

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:15px;

    padding:
        clamp(
            8px,
            1vh,
            15px
        )
        5px;

    border-bottom:
        1px solid #ddd;

    font-weight:bold;

    color:#000;

    flex:1;
}

.row:last-child{

    border-bottom:none;
}


/* =========================
   EDITABLE VALUES
========================= */

.editable{

    outline:none;

    cursor:text;

    border-radius:6px;

    padding:
        4px 8px;
}


/* =========================
   ROW LABEL
========================= */

.row_heading{

    font-size: 40px;

    white-space:nowrap;

    color:#000;
}


/* =========================
   TIME VALUE
========================= */

.time-value{

    min-width:120px;

    text-align:right;

    background:#fff;

    font-size:60px;;
}


/* =========================
   EDITABLE HOVER
========================= */

.editable:hover{

    background:#f2f2f2;
}

.editable:focus{

    background:#eeeeee;
}


/* =========================
   LOGO
========================= */

.logo{

    position:fixed;

    top:10px;
    left:10px;

    z-index:9999;

    width:200px;
}

.logo img{

    width:100%;

    display:block;
}


/* =========================
   MEDIUM SCREENS
========================= */

@media(max-width:1100px){

    .dashboard{

        gap:10px;

        padding:10px;
    }


    .clock{

        border-width:7px;
    }


    .tables{

        gap:10px;
    }


    .info{

        padding:10px;

        border-width:2px;
    }


    .row{

        gap:8px;

        padding:7px 3px;
    }


    .time-value{

        min-width:90px;
    }


    .logo{

        width:150px;
    }

}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    body{

        overflow:auto;

        align-items:flex-start;
    }


    .dashboard{

        width:100%;

        height:auto;

        min-height:100vh;

        flex-direction:column;

        gap:20px;

        padding:10px;
    }


    /* CLOCK */

    .clock-wrap{

        width:100%;

        height:auto;

        flex:none;
    }


    .clock{

        width:
            min(
                95vw,
                95vh
            );

        height:auto;

        aspect-ratio:1 / 1;

        border-width:6px;
    }


    /* TABLE AREA */

    .table-wrap{

        width:100%;

        height:auto;

        flex:none;

        overflow:visible;
    }


    /* TWO TABLES */

    .tables{

        width:100%;

        height:auto;

        gap:15px;

        overflow:visible;
    }


    /* INDIVIDUAL TABLE */

    .info{

        width:100%;

        min-height:220px;

        height:auto;

        flex:none;

        font-size:18px;

        padding:12px;

    }


    /* SUBJECT */

    .subject-heading{

        font-size:18px;

        padding:
            6px
            8px
            12px;
    }


    /* ROWS */

    .row{

        min-height:55px;

        flex:none;

        padding:8px 3px;
    }


    .row_heading{

        font-size:18px;
    }


    .time-value{

        min-width:80px;

        font-size:16px;
    }


    .digital{

        font-size:7vw;
    }


    .date{

        font-size:4vw;
    }


    .logo{

        width:120px;
    }

}


/* =========================
   MOBILE TOGGLE BUTTON
========================= */

@media(max-width:700px){

    .toggle-info{

        width:30px;
        height:30px;

        top:8px;
        right:8px;

        font-size:14px;
    }

}

</style>

</head>


<body>


<!-- =========================
     TOGGLE BUTTON
========================= -->

<button
    class="toggle-info"
    id="toggleInfo"
    title="Show / Hide time and date"
    aria-label="Show or hide digital time and date"
>
    ◉
</button>


<!-- =========================
     DASHBOARD
========================= -->

<div class="dashboard">


    <!-- =====================
         LOGO
    ====================== -->

    <a
        href="../index.html"
        class="logo"
    >

        <img
            src="../imgs/banner_logo_round_border.png"
            alt="Banner Logo"
        >

    </a>


    <!-- =====================
         CLOCK
    ====================== -->

    <div class="clock-wrap">

        <div
            class="clock"
            id="clock"
        >


            <!-- HANDS -->

            <div
                class="hour hand"
                id="hour"
            ></div>


            <div
                class="minute hand"
                id="minute"
            ></div>


            <div
                class="second hand"
                id="second"
            ></div>


            <!-- CENTER -->

            <div class="center"></div>


            <!-- DIGITAL TIME -->

            <div
                class="digital"
                id="digital"
            ></div>


            <!-- DATE -->

            <div
                class="date"
                id="date"
            ></div>

        </div>

    </div>


    <!-- =====================
     TABLE AREA
====================== -->

<div class="table-wrap">

    <div class="tables">


        <!-- =================
             SUBJECT 1
        ================== -->

        <div class="info">

            <div
                class="subject-heading editable"
                contenteditable="true"
                spellcheck="false"
            >
                Subject 1
            </div>


            <div class="row">

                <span
                    class="row_heading editable"
                    contenteditable="true"
                    spellcheck="false"
                >
                    Start Time
                </span>

                <span
                    class="time-value editable"
                    contenteditable="true"
                    spellcheck="false"
                >
                    00:00 AM
                </span>

            </div>


            <div class="row">

                <span
                    class="row_heading editable"
                    contenteditable="true"
                    spellcheck="false"
                >
                    End Time
                </span>

                <span
                    class="time-value editable"
                    contenteditable="true"
                    spellcheck="false"
                >
                    00:00 AM
                </span>

            </div>

        </div>


        <!-- =================
             SUBJECT 2
        ================== -->

        <div class="info">

            <div
                class="subject-heading editable"
                contenteditable="true"
                spellcheck="false"
            >
                Subject 2
            </div>


            <div class="row">

                <span
                    class="row_heading editable"
                    contenteditable="true"
                    spellcheck="false"
                >
                    Start Time
                </span>

                <span
                    class="time-value editable"
                    contenteditable="true"
                    spellcheck="false"
                >
                    00:00 AM
                </span>

            </div>


            <div class="row">

                <span
                    class="row_heading editable"
                    contenteditable="true"
                    spellcheck="false"
                >
                    End Time
                </span>

                <span
                    class="time-value editable"
                    contenteditable="true"
                    spellcheck="false"
                >
                    00:00 AM
                </span>

            </div>

        </div>


        <!-- =================
             SUBJECT 3
        ================== -->

        <div class="info">

            <div
                class="subject-heading editable"
                contenteditable="true"
                spellcheck="false"
            >
                Subject 3
            </div>


            <div class="row">

                <span
                    class="row_heading editable"
                    contenteditable="true"
                    spellcheck="false"
                >
                    Start Time
                </span>

                <span
                    class="time-value editable"
                    contenteditable="true"
                    spellcheck="false"
                >
                    00:00 AM
                </span>

            </div>


            <div class="row">

                <span
                    class="row_heading editable"
                    contenteditable="true"
                    spellcheck="false"
                >
                    End Time
                </span>

                <span
                    class="time-value editable"
                    contenteditable="true"
                    spellcheck="false"
                >
                    00:00 AM
                </span>

            </div>

        </div>


    </div>

</div>

</div>


<script>


/* =========================
   CLOCK NUMBERS
========================= */

const clock =
    document.getElementById("clock");


for(let i = 1; i <= 12; i++){

    const n =
        document.createElement("div");


    n.className =
        "number";


    n.style.transform =
        `rotate(${i * 30}deg)`;


    const s =
        document.createElement("span");


    s.textContent =
        i;


    s.style.transform =
        `translateY(30px) rotate(${-i * 30}deg)`;


    n.appendChild(s);


    clock.appendChild(n);

}


/* =========================
   CLOCK TICKS
========================= */

for(let i = 0; i < 60; i++){

    const t =
        document.createElement("div");


    t.className =
        "tick" +
        (
            i % 5 === 0
            ? " major"
            : ""
        );


    t.style.transform =
        `translate(-50%,-100%) rotate(${i * 6}deg)`;


    clock.appendChild(t);

}


/* =========================
   CLOCK ELEMENTS
========================= */

const hour =
    document.getElementById("hour");


const minute =
    document.getElementById("minute");


const second =
    document.getElementById("second");


const digital =
    document.getElementById("digital");


const date =
    document.getElementById("date");


/* =========================
   TOGGLE DIGITAL TIME + DATE
========================= */

const toggleInfo =
    document.getElementById("toggleInfo");


toggleInfo.addEventListener(
    "click",
    function(){

        clock.classList.toggle(
            "hide-info"
        );


        if(
            clock.classList.contains(
                "hide-info"
            )
        ){

            toggleInfo.textContent =
                "○";


            toggleInfo.title =
                "Show time and date";

        }
        else{

            toggleInfo.textContent =
                "◉";


            toggleInfo.title =
                "Hide time and date";

        }

    }
);


/* =========================
   UPDATE CLOCK
========================= */

function update(){

    const now =
        new Date();


    /* =====================
       TIME CALCULATION
    ====================== */

    const sec =
        now.getSeconds();


    const min =
        now.getMinutes() +
        sec / 60;


    const hr =
        (now.getHours() % 12) +
        min / 60;


    /* =====================
       HOUR HAND
    ====================== */

    hour.style.transform =
        `translateX(-50%) rotate(${hr * 30}deg)`;


    /* =====================
       MINUTE HAND
    ====================== */

    minute.style.transform =
        `translateX(-50%) rotate(${min * 6}deg)`;


    /* =====================
       SECOND HAND
    ====================== */

    second.style.transform =
        `translateX(-50%) rotate(${sec * 6}deg)`;


    /* =====================
       DIGITAL TIME
    ====================== */

    digital.textContent =
        now.toLocaleTimeString();


    /* =====================
       CLOCK DATE
    ====================== */

    date.textContent =
        now.toLocaleDateString(
            undefined,
            {
                weekday:"short",
                day:"numeric",
                month:"short",
                year:"numeric"
            }
        );


    /* =====================
       SYNCHRONIZE
    ====================== */

    setTimeout(
        update,
        1000 -
        now.getMilliseconds()
    );

}


/* =========================
   START CLOCK
========================= */

update();

</script>

</body>
</html>
